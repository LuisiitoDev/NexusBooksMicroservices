services:
  nexusbooks.author.api:
    image: ${DOCKER_REGISTRY-}nexusbooksauthorapi
    build:
      context: .
      dockerfile: NexusBooks.Author.Api/Dockerfile

  nexusbooks.book.api:
    image: ${DOCKER_REGISTRY-}nexusbooksbookapi
    build:
      context: .
      dockerfile: NexusBooks.Book.Api/Dockerfile


  nexusbooks.shoppingcart.api:
    image: ${DOCKER_REGISTRY-}nexusbooksshoppingcartapi
    build:
      context: .
      dockerfile: NexusBooks.ShoppingCart.Api/Dockerfile


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SQLSERVER_SA_PASSWORD}"
      MSSQL_PID: "Developer"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql



volumes:
  sqlserver-data:

