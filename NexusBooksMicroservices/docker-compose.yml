services:
  nexusbooks.author.api:
    image: ${DOCKER_REGISTRY-}nexusbooksauthorapi
    build:
      context: .
      dockerfile: NexusBooks.Author.Api/Dockerfile
    depends_on:
      - sqlserver

  nexusbooks.book.api:
    image: ${DOCKER_REGISTRY-}nexusbooksbookapi
    build:
      context: .
      dockerfile: NexusBooks.Book.Api/Dockerfile
    depends_on:
      - postgres


  nexusbooks.shoppingcart.api:
    image: ${DOCKER_REGISTRY-}nexusbooksshoppingcartapi
    build:
      context: .
      dockerfile: NexusBooks.ShoppingCart.Api/Dockerfile
    depends_on:
      - mysql


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "${SQLSERVER_SA_PASSWORD}"
      MSSQL_PID: "Developer"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "NexusBooksBookDb"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "NexusBooksShoppingCartDb"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql


volumes:
  sqlserver-data:
  postgres-data:
  mysql-data:

