services:
  nexusbooks.book.author:
    image: ${DOCKER_REGISTRY-}nexusbookauthor
    build:
      context: .
      dockerfile: NexusBooks.Book.Author/Dockerfile
    depends_on:
      sql_server:
        condition: service_healthy

  nexusbooks.book.api:
    image: ${DOCKER_REGISTRY-}nexusbooksbookapi
    build:
      context: .
      dockerfile: NexusBooks.Book.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy

  nexusbooks.shoppingcart.api:
    image: ${DOCKER_REGISTRY-}nexusbooksshoppingcartapi
    build:
      context: .
      dockerfile: NexusBooks.ShoppingCart.Api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy


  nexusbooks.gateway:
    image: ${DOCKER_REGISTRY-}nexusbooksgateway
    build:
      context: .
      dockerfile: NexusBooks.Gateway/Dockerfile


  nexusbooks.client:
    image: ${DOCKER_REGISTRY-}nexusbooksclient
    build:
      context: .
      dockerfile: NexusBooks.Client/Dockerfile

  sql_server:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD}"
      MSSQL_PID: "Developer"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -d master -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: NexusBooksBookDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d NexusBooksBookDb
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: NexusBooksShoppingCartDb
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -proot
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sqlserver-data:
  postgres-data:
  mysql-data:
