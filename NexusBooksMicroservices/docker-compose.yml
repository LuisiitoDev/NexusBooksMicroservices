services:
  nexusbooks.book.author:
    image: ${DOCKER_REGISTRY-}nexusbookauthor
    build:
      context: .
      dockerfile: NexusBooks.Author.Api/Dockerfile
    environment:
      - ConnectionStrings__AuthorDb=Server=sql_server,1433;Database=AuthorDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;
    depends_on:
      sql_server:
        condition: service_healthy

  nexusbooks.book.api:
    image: ${DOCKER_REGISTRY-}nexusbooksbookapi
    build:
      context: .
      dockerfile: NexusBooks.Book.Api/Dockerfile
    environment:
      - ConnectionStrings__BookDb=Host=postgres;Port=5432;Database=NexusBooksBookDb;Username=postgres;Password=postgres;Include Error Detail=true
    depends_on:
      postgres:
        condition: service_healthy

  nexusbooks.shoppingcart.api:
    image: ${DOCKER_REGISTRY-}nexusbooksshoppingcartapi
    build:
      context: .
      dockerfile: NexusBooks.ShoppingCart.Api/Dockerfile
    environment:
      - ConnectionStrings__ShoppingCartDb=Server=mysql;Port=3306;Database=NexusBooksShoppingCartDb;User=root;Password=root;Allow User Variables=True;CharSet=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy


  nexusbooks.gateway:
    image: ${DOCKER_REGISTRY-}nexusbooksgateway
    build:
      context: .
      dockerfile: NexusBooks.Gateway/Dockerfile
    environment:
      - ServiceEndpoints__Authors=http://nexusbooks.book.author:8080/
      - ServiceEndpoints__Books=http://nexusbooks.book.api:8080/
      - ServiceEndpoints__ShoppingCart=http://nexusbooks.shoppingcart.api:8080/
    depends_on:
      - nexusbooks.book.author
      - nexusbooks.book.api
      - nexusbooks.shoppingcart.api


  nexusbooks.client:
    image: ${DOCKER_REGISTRY-}nexusbooksclient
    build:
      context: .
      dockerfile: NexusBooks.Client/Dockerfile
    environment:
      - ApiEndpoints__Gateway=http://nexusbooks.gateway:8080
    depends_on:
      - nexusbooks.gateway
    ports:
      - "8080:8080"

  sql_server:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD}"
      MSSQL_PID: "Developer"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -d master -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: NexusBooksBookDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d NexusBooksBookDb
      interval: 10s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0.41
    environment:
      MYSQL_DATABASE: NexusBooksShoppingCartDb
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -proot
      interval: 10s
      timeout: 5s
      retries: 10


volumes:
  sqlserver-data:
  postgres-data:
  mysql-data:
